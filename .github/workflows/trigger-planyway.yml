name: Trigger Planyway Audit

# This workflow lives on a public repo so GitHub Actions schedule fires
# closer to the requested time than it does on the private workhoursystem
# repo (which has been consistently delayed ~4 hours). It does nothing
# but POST workflow_dispatch to learninginscience/workhoursystem.

on:
  schedule:
    # Taiwan 10:00 Mon-Fri (UTC 02:00). Daily Planyway check.
    - cron: "0 2 * * 1-5"
    # Taiwan 09:30 Monday (UTC 01:30). Weekly Planyway check.
    - cron: "30 1 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Which check to dispatch
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
      dry_run:
        description: Send dispatch with dry_run flag
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Pick mode from event
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * 1" ]; then
              echo "mode=weekly" >> "$GITHUB_OUTPUT"
            else
              echo "mode=daily" >> "$GITHUB_OUTPUT"
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch workhoursystem/planyway-audit
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          MODE: ${{ steps.pick.outputs.mode }}
          DRY_RUN: ${{ steps.pick.outputs.dry_run }}
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"main","inputs":{"mode":"%s","dry_run":"%s"}}' "$MODE" "$DRY_RUN")
          echo "dispatching: $payload"
          http_code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            https://api.github.com/repos/learninginscience/workhoursystem/actions/workflows/planyway-audit.yml/dispatches)
          echo "HTTP $http_code"
          cat /tmp/resp.txt
          if [ "$http_code" != "204" ]; then
            exit 1
          fi
